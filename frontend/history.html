<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử thiết bị - Hệ thống Giám sát IoT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="dashboard.html" class="sidebar-logo">IOT</a>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <a href="dashboard.html" class="nav-link">
            <svg viewBox="0 0 24 24">
              <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            <span>DASHBOARD</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="data-sensor.html" class="nav-link">
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
            <span>DATA SENSOR</span>
          </a>
        </li>
        <li class="nav-item active">
          <a href="history.html" class="nav-link">
            <svg viewBox="0 0 24 24">
              <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
            <span>HISTORY</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="profile.html" class="nav-link">
            <svg viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>MY PROFILE</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <div class="header-breadcrumb">Pages / History</div>
          <h2 class="header-title">DEVICE ACTIVITY</h2>
        </div>

        <div class="header-right">
          <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#2B3674">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
          </button>

          <div class="user-profile-widget">
            <span class="user-name">Nguyễn Xuân Đạt</span>
            <img src="assets/avt.JPG" alt="Avatar" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Nguyen+Xuan+Dat&background=4318FF&color=fff'">
          </div>

          <button class="btn-logout" id="btnLogout" title="Đăng xuất">
            <svg viewBox="0 0 24 24">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            <span>Đăng xuất</span>
          </button>
        </div>
      </header>

      <!-- Khung bảng dữ liệu & Thanh công cụ -->
      <div class="data-card">
        <!-- Toolbar lọc và tìm kiếm -->
        <div class="toolbar">
          <div class="toolbar-left">
            <!-- Dropdown chọn thiết bị -->
            <select id="deviceFilter" class="filter-select">
              <option value="">Thiết Bị</option>
              <option value="Đèn LED">Đèn LED</option>
              <option value="Quạt">Quạt</option>
              <option value="Điều hoà">Điều hoà</option>
            </select>

            <!-- Dropdown chọn hành động -->
            <select id="actionFilter" class="filter-select">
              <option value="">Hành Động</option>
              <option value="ON">ON</option>
              <option value="OFF">OFF</option>
            </select>

            <!-- Dropdown chọn trạng thái -->
            <select id="statusFilter" class="filter-select">
              <option value="">Trạng Thái</option>
              <option value="success">success</option>
              <option value="failed">failed</option>
              <option value="pending">pending</option>
            </select>
            <!-- Ô nhập tìm kiếm thời gian -->
            <input type="text" id="timeSearchInput" class="filter-input" maxlength="100" placeholder="Nhập thời gian">

            <!-- Nút bấm Tìm kiếm -->
            <button id="btnSearch" class="btn-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
              </svg>
              <span>Tìm Kiếm</span>
            </button>
          </div>

          <!-- Dropdown sắp xếp -->
          <div class="toolbar-right">
            <select id="sortOrder" class="filter-select">
              <option value="desc" selected>Giảm dần</option>
              <option value="asc">Tăng dần</option>
            </select>
          </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="table-responsive">
          <table class="iot-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Thiết Bị</th>
                <th>Hành Động</th>
                <th>Trạng Thái</th>
                <th>Người Điều Khiển</th>
                <th>Thời Gian</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Render bằng JavaScript -->
              <tr>
                <td colspan="6" class="table-empty">Đang tải lịch sử điều khiển...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Khu vực cuối bảng: Trang hiện tại, Tổng số trang & Page Size -->
        <div class="table-footer">
          <div class="pagination-info">
            <span class="page-stat-badge">
              Trang <strong id="currentPageDisplay">1</strong> / <strong id="totalPagesDisplay">1</strong>
            </span>
            <span class="stat-divider">•</span>
            <div class="page-size-wrapper">
              <span class="config-label">Page Size:</span>
              <select id="pageSizeSelect" class="page-size-select">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>

          <!-- Thanh phân trang (Pagination) -->
          <div class="pagination-container" id="pagination">
            <!-- Các nút phân trang được tạo động -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
