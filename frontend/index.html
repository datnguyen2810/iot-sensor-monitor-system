<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống Giám sát IoT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-top-label">Login</div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </div>

      <h1 class="login-title">Đăng nhập hệ thống</h1>
      <p class="login-subtitle">Quản lý và giám sát môi trường IoT</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="form-input" placeholder="Nhập admin..." required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="togglePassword" class="toggle-password-btn" title="Hiện/Ẩn mật khẩu">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" id="rememberMe">
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <button type="submit" id="btnLogin" class="btn-primary">
          <span id="btnText">ĐĂNG NHẬP</span>
        </button>

      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Kiểm tra nếu đã có token thì chuyển thẳng vào dashboard
      Auth.redirectIfAuthenticated();

      // Điền sẵn username nếu trước đó đã chọn "Ghi nhớ đăng nhập"
      const rememberedUser = localStorage.getItem('iot_remember_username');
      if (rememberedUser) {
        document.getElementById('username').value = rememberedUser;
        document.getElementById('rememberMe').checked = true;
      }

      // Xử lý bật/tắt hiển thị mật khẩu
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePassword');
      let isPasswordVisible = false;

      togglePasswordBtn.addEventListener('click', () => {
        isPasswordVisible = !isPasswordVisible;
        passwordInput.type = isPasswordVisible ? 'text' : 'password';

        // Đổi icon SVG
        togglePasswordBtn.innerHTML = isPasswordVisible
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
      });

      // Xử lý gửi biểu mẫu Đăng nhập
      const loginForm = document.getElementById('loginForm');
      const btnLogin = document.getElementById('btnLogin');
      const btnText = document.getElementById('btnText');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        if (!username || !password) {
          showToast('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!', 'warning');
          return;
        }

        // Khóa nút trong quá trình xử lý
        btnLogin.disabled = true;
        btnText.textContent = 'ĐANG ĐĂNG NHẬP...';

        try {
          await Auth.login(username, password, rememberMe);
        } finally {
          btnLogin.disabled = false;
          btnText.textContent = 'ĐĂNG NHẬP';
        }
      });

    });
  </script>
</body>
</html>
