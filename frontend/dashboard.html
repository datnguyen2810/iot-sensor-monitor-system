<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hệ thống Giám sát IoT</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js qua CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="dashboard.html" class="sidebar-logo">IOT</a>
      </div> 

      <ul class="sidebar-nav">
        <li class="nav-item active">
          <a href="dashboard.html" class="nav-link">
            <!-- Icon Dashboard -->
            <svg viewBox="0 0 24 24">
              <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            <span>DASHBOARD</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="data-sensor.html" class="nav-link">
            <!-- Icon Data Sensor -->
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
            <span>DATA SENSOR</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="history.html" class="nav-link">
            <!-- Icon History -->
            <svg viewBox="0 0 24 24">
              <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
            <span>HISTORY</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="profile.html" class="nav-link">
            <!-- Icon Profile -->
            <svg viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>MY PROFILE</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <div class="header-breadcrumb">Pages / Dashboard</div>
          <h2 class="header-title">Dashboard</h2>
        </div>

        <div class="header-right">
          <button class="mobile-menu-btn" id="mobileMenuBtn" title="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#2B3674">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
          </button>

          <div class="user-profile-widget">
            <span class="user-name">Nguyễn Xuân Đạt</span>
            <img src="assets/avt.JPG" alt="Avatar" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Nguyen+Xuan+Dat&background=4318FF&color=fff'">
          </div>

          <button class="btn-logout" id="btnLogout" title="Đăng xuất">
            <svg viewBox="0 0 24 24">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            <span>Đăng xuất</span>
          </button>
        </div>
      </header>

      <!-- Hàng 3 card cảm biến -->
      <div class="sensor-cards-grid">
        <!-- Card 1: Nhiệt độ -->
        <div class="sensor-card purple">
          <div class="sensor-card-header">
            <svg viewBox="0 0 24 24">
              <path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-2V5c0-.55.45-1 1-1s1 .45 1 1v1h-1v1h1v2h-1v1h1v1h-2z"/>
            </svg>
            <span>Nhiệt độ</span>
          </div>
          <div class="sensor-card-value" id="cardTemp">
            <span id="tempValue">--</span> <span class="unit">°C</span>
          </div>
        </div>

        <!-- Card 2: Ánh sáng -->
        <div class="sensor-card orange">
          <div class="sensor-card-header">
            <svg viewBox="0 0 24 24">
              <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-1.3l-.85-.6C7.8 13.16 7 11.18 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 2.18-.8 4.16-2.15 5.1z"/>
            </svg>
            <span>Ánh sáng</span>
          </div>
          <div class="sensor-card-value" id="cardLight">
            <span id="lightValue">--</span> <span class="unit">LUX</span>
          </div>
        </div>

        <!-- Card 3: Độ ẩm -->
        <div class="sensor-card red">
          <div class="sensor-card-header">
            <svg viewBox="0 0 24 24">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
            <span>Độ ẩm</span>
          </div>
          <div class="sensor-card-value" id="cardHumidity">
            <span id="humidityValue">--</span> <span class="unit">%</span>
          </div>
        </div>
      </div>

      <!-- Hàng dưới: Biểu đồ và Cụm công tắc điều khiển -->
      <div class="dashboard-lower-grid">
        <!-- Biểu đồ Chart.js -->
        <div class="chart-card">
          <div class="chart-card-header">
            <div class="chart-title">Theo dõi cảm biến</div>
            <div class="chart-custom-legend">
              <div class="legend-item">
                <span class="legend-color-box temp"></span>
                <span>Nhiệt độ (°C)</span>
              </div>
              <div class="legend-item">
                <span class="legend-color-box humidity"></span>
                <span>Độ ẩm (%)</span>
              </div>
              <div class="legend-item">
                <span class="legend-color-box light"></span>
                <span>Ánh sáng (Lux)</span>
              </div>
            </div>
          </div>

          <div class="chart-wrapper">
            <canvas id="sensorChart"></canvas>
          </div>
        </div>

        <!-- Cột công tắc điều khiển 3 thiết bị -->
        <div class="devices-column">
          <!-- Thiết bị 1: Đèn LED -->
          <div class="device-card" id="card-led">
            <div class="device-info">
              <div class="device-icon device-icon-led">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M9 21c0 .5.4 1 1 1h4c.6 0 1-.5 1-1v-1H9v1zm3-19C8.1 2 5 5.1 5 9c0 2.4 1.2 4.5 3 5.7V17c0 .5.4 1 1 1h6c.6 0 1-.5 1-1v-2.3c1.8-1.3 3-3.4 3-5.7 0-3.9-3.1-7-7-7z"/>
                </svg>
                <div class="glow-ring"></div>
              </div>
              <div class="device-text">
                <span class="device-name">Đèn LED</span>
                <span class="device-status-badge" id="status-led">Chưa xác nhận</span>
              </div>
            </div>
            <label class="switch-control" id="control-led">
              <input type="checkbox" id="switch-led" data-device="led" disabled>
              <span class="switch-slider"></span>
            </label>
          </div>

          <!-- Thiết bị 2: Quạt -->
          <div class="device-card" id="card-fan">
            <div class="device-info">
              <div class="device-icon device-icon-fan">
                <svg viewBox="0 0 24 24" fill="currentColor" class="fan-blade">
                  <path d="M12 11c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-3.6 7.4c-.3.3-.3.8 0 1.1l.7.7c.3.3.8.3 1.1 0L12 18.4l1.8 1.8c.3.3.8.3 1.1 0l.7-.7c.3-.3.3-.8 0-1.1L13.8 16.6V14h2.6l1.8 1.8c.3.3.8.3 1.1 0l.7-.7c.3-.3.3-.8 0-1.1L18.2 12.2 20 10.4c.3-.3.3-.8 0-1.1l-.7-.7c-.3-.3-.8-.3-1.1 0L16.4 10.4H13.8V7.8l1.8-1.8c.3-.3.3-.8 0-1.1l-.7-.7c-.3-.3-.8-.3-1.1 0L12 6l-1.8-1.8c-.3-.3-.8-.3-1.1 0l-.7.7c-.3.3-.3.8 0 1.1L10.2 7.8V10.4H7.6L5.8 8.6c-.3-.3-.8-.3-1.1 0l-.7.7c-.3.3-.3.8 0 1.1L5.8 12.2 4 14c-.3.3-.3.8 0 1.1l.7.7c.3.3.8.3 1.1 0L7.6 14H10.2v2.6L8.4 18.4z"/>
                </svg>
              </div>
              <div class="device-text">
                <span class="device-name">Quạt</span>
                <span class="device-status-badge" id="status-fan">Chưa xác nhận</span>
              </div>
            </div>
            <label class="switch-control" id="control-fan">
              <input type="checkbox" id="switch-fan" data-device="fan" disabled>
              <span class="switch-slider"></span>
            </label>
          </div>

          <!-- Thiết bị 3: Điều hoà -->
          <div class="device-card" id="card-ac">
            <div class="device-info">
              <div class="device-icon device-icon-ac">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22 11h-4.17l3.24-3.24-1.41-1.42L15 11h-2V9l4.66-4.66-1.42-1.41L13 6.17V2h-2v4.17L7.76 2.93 6.34 4.34 11 9v2H9L4.34 6.34 2.93 7.76 6.17 11H2v2h4.17l-3.24 3.24 1.41 1.42L9 13h2v2l-4.66 4.66 1.42 1.41L11 17.83V22h2v-4.17l3.24 3.24 1.42-1.41L13 15v-2h2l4.66 4.66 1.41-1.42L17.83 13H22v-2z"/>
                </svg>
                <div class="breeze-particles">
                  <span></span><span></span><span></span>
                </div>
              </div>
              <div class="device-text">
                <span class="device-name">Điều hoà</span>
                <span class="device-status-badge" id="status-ac">Chưa xác nhận</span>
              </div>
            </div>
            <label class="switch-control" id="control-ac">
              <input type="checkbox" id="switch-ac" data-device="ac" disabled>
              <span class="switch-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
